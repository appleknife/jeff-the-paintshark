<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jeff the PaintShark</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PaintShark">
<meta name="description" content="Jeff the PaintShark — an offline iPad art studio with pressure, tilt, layers, selections, liquify, warp and timelapse.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4 7 12l8 8"/></symbol>
  <symbol id="i-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 10h9a6 6 0 0 1 0 12H9"/><path d="m8 6-4 4 4 4"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 10h-9a6 6 0 0 0 0 12h4"/><path d="m16 6 4 4-4 4"/></symbol>
  <symbol id="i-brush" viewBox="0 0 24 24"><path d="M4 20c3 0 4-2 4-4s2-3 4-3 3 1 5-1 3-7 3-7-5 1-7 3-1 3-1 5-1 4-3 4-4 1-5 3z"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 20-4-4 10-10 6 6-6 6h4"/><path d="M10 7l7 7"/></symbol>
  <symbol id="i-smudge" viewBox="0 0 24 24"><path d="M5 15c3-6 8-9 13-9-2 3-3 5-3 8 0 3-2 5-5 5s-5-1-5-4z"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M9 9h6v6H9z"/></symbol>
  <symbol id="i-transform" viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M4 15v5h5M15 4h5v5"/><path d="m9 15 6-6M9 9h6v6"/></symbol>
  <symbol id="i-liquify" viewBox="0 0 24 24"><path d="M6 4c0 4 3 4 3 8s-3 4-3 8"/><path d="M12 4c0 4 3 4 3 8s-3 4-3 8"/><path d="M18 4c0 4 3 4 3 8s-3 4-3 8"/></symbol>
  <symbol id="i-adjust" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>
  <symbol id="i-color" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8 4-8 4-8-4z"/><path d="m4 12 8 4 8-4M4 16l8 4 8-4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-mask" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M9 4v10a3 3 0 0 0 6 0V7a2 2 0 0 0-4 0v8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></symbol>
  <symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 4v6a6 6 0 0 0 6 6h6"/><path d="m15 13 3 3-3 3"/></symbol>
  <symbol id="i-guide" viewBox="0 0 24 24"><path d="M4 4v16M4 20h16"/><path d="M9 9v11M14 5v15M4 9h16M4 14h16"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 14v6h14v-6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-wand" viewBox="0 0 24 24"><path d="m5 19 9-9M15 4l1.5 3.5L20 9l-3.5 1.5L15 14l-1.5-3.5L10 9l3.5-1.5z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></symbol>
  <symbol id="i-reference" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M3 14l5-4 4 3 3-2 6 4"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9M6.1 6.6C3.6 8.3 2 12 2 12s4 7 10 7a9.6 9.6 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h13M17 12l4 4-4 4M21 16H8"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-grid4" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></symbol>
</svg>

<main id="gallery" class="gallery">
  <header class="gallery-head">
    <div class="brand">
      <img class="logo" src="icons/logo.png" alt="Jeff the Paintshark" width="371" height="360">
      <div>
        <h1 class="sr-only">Jeff the PaintShark</h1>
        <p class="muted">Paint like a shark. Bite the canvas.</p>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="importArt"><svg><use href="#i-share"/></svg>Import</button>
      <button class="btn primary" id="newArt"><svg><use href="#i-add"/></svg>New Canvas</button>
      <button class="icon-btn" id="openSettings" title="Settings" aria-label="Settings"><svg><use href="#i-settings"/></svg></button>
    </div>
  </header>
  <section id="galleryGrid" class="gallery-grid"></section>
  <p id="galleryEmpty" class="empty">Your gallery is empty. Tap <b>New Canvas</b> to start a painting.</p>
</main>

<main id="studio" class="studio hidden">
  <header class="topbar">
    <div class="pill">
      <button class="icon-btn" id="backBtn" title="Gallery" aria-label="Back to gallery"><svg><use href="#i-back"/></svg></button>
      <input id="docName" class="doc-name" value="Untitled" aria-label="Artwork name">
      <span class="pill-sep"></span>
      <button class="icon-btn" id="undoBtn" title="Undo" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
      <button class="icon-btn" id="redoBtn" title="Redo" aria-label="Redo"><svg><use href="#i-redo"/></svg></button>
    </div>
    <span class="spacer"></span>
    <div class="pill">
    <button class="icon-btn" id="guideBtn" title="Drawing guide"><svg><use href="#i-guide"/></svg></button>
    <button class="icon-btn" id="timeBtn" title="Timelapse"><svg><use href="#i-timer"/></svg></button>
    <button class="icon-btn" id="refBtn" title="Reference"><svg><use href="#i-reference"/></svg></button>
    <button class="icon-btn" id="shareBtn" title="Export"><svg><use href="#i-share"/></svg></button>
    <button class="icon-btn" id="layersBtn" title="Layers"><svg><use href="#i-layers"/></svg></button>
    </div>
  </header>
  <button id="exitFullscreen" class="exit-fs hidden" title="Exit full screen" aria-label="Exit full screen"><svg><use href="#i-shrink"/></svg><span>Exit full screen</span></button>

  <div class="body">
    <nav class="rail" id="toolRail">
      <button class="tool" data-tool="brush" title="Paint"><svg><use href="#i-brush"/></svg></button>
      <button class="tool" data-tool="smudge" title="Smudge"><svg><use href="#i-smudge"/></svg></button>
      <button class="tool" data-tool="erase" title="Erase"><svg><use href="#i-eraser"/></svg></button>
      <span class="rail-sep"></span>
      <button class="tool" data-tool="select" title="Selection"><svg><use href="#i-select"/></svg></button>
      <button class="tool" data-tool="transform" title="Transform"><svg><use href="#i-transform"/></svg></button>
      <button class="tool" data-tool="liquify" title="Liquify"><svg><use href="#i-liquify"/></svg></button>
      <button class="tool" data-tool="adjust" title="Adjustments"><svg><use href="#i-adjust"/></svg></button>
      <button class="tool" data-tool="text" title="Text"><svg><use href="#i-text"/></svg></button>
      <span class="rail-sep"></span>
      <button class="tool" data-tool="eyedropper" title="Eyedropper"><svg><use href="#i-wand"/></svg></button>
      <button class="tool" data-tool="fill" title="ColorDrop"><svg><use href="#i-color"/></svg></button>
      <button class="tool" id="studioBtn" title="Brush Studio"><svg><use href="#i-settings"/></svg></button>
    </nav>

    <div id="stageWrap" class="stage-wrap">
      <canvas id="view"></canvas>
      <canvas id="overlay"></canvas>
      <div id="brushHud" class="brush-hud hidden"></div>
      <div id="refPane" class="ref-pane hidden">
        <header><b>Reference</b><button class="icon-btn" id="refClose"><svg><use href="#i-close"/></svg></button></header>
        <canvas id="refCanvas"></canvas>
      </div>
    </div>

    <aside id="sidePanel" class="side hidden">
      <div class="panel" id="layersPanel">
        <header class="panel-head">
          <b>Layers</b>
          <span class="spacer"></span>
          <button class="icon-btn" id="layerAdd" title="Add layer" data-sfx="add"><svg><use href="#i-plus"/></svg></button>
          <button class="icon-btn" id="layerDup" title="Duplicate layer" data-sfx="add"><svg><use href="#i-dup"/></svg></button>
          <button class="icon-btn" id="layerMerge" title="Merge down" data-sfx="brush"><svg><use href="#i-merge"/></svg></button>
          <button class="icon-btn" id="layerDel" title="Delete layer" data-sfx="remove"><svg><use href="#i-trash"/></svg></button>
          <button class="icon-btn" id="layerGroup" title="Group"><svg><use href="#i-layers"/></svg></button>
          <button class="icon-btn" id="panelClose"><svg><use href="#i-close"/></svg></button>
        </header>
        <div class="layer-opts">
          <label>Blend
            <select id="blendSelect"></select>
          </label>
          <label class="slider-row">Opacity
            <input id="layerOpacity" type="range" min="0" max="100" value="100">
            <output id="layerOpacityVal">100%</output>
          </label>
          <div class="layer-toggles">
            <button class="chip" id="alphaLock"><svg><use href="#i-lock"/></svg>Alpha Lock</button>
            <button class="chip" id="clipMask"><svg><use href="#i-clip"/></svg>Clip</button>
            <button class="chip" id="layerMask"><svg><use href="#i-mask"/></svg>Mask</button>
          </div>
        </div>
        <div id="layerList" class="layer-list"></div>
        <div class="panel-foot">
          <span class="muted" id="layerInfo"></span>
        </div>
      </div>

      <div class="panel" id="colorPanel">
        <header class="panel-head"><b>Color</b><span class="spacer"></span>
          <button class="icon-btn" id="colorClose"><svg><use href="#i-close"/></svg></button></header>
        <div class="wheel-wrap"><canvas id="wheel" class="wheel"></canvas><span id="wheelSwatch" class="wheel-swatch"></span></div>
        <div class="sv"><canvas id="svBox"></canvas></div>
        <div class="sliders">
          <label>Hue<input id="hue" type="range" min="0" max="360" value="20"></label>
          <label>Sat<input id="sat" type="range" min="0" max="100" value="70"></label>
          <label>Val<input id="val" type="range" min="0" max="100" value="100"></label>
          <label>Alpha<input id="alpha" type="range" min="0" max="100" value="100"></label>
        </div>
        <div class="swatches" id="swatches"></div>
        <div class="row small">
          <button class="btn small" id="addSwatch" data-sfx="add">Save swatch</button>
          <button class="btn small ghost" id="newPalette">New palette</button>
        </div>
      </div>

      <div class="panel" id="studioPanel">
        <header class="panel-head"><b>Brush Studio</b><span class="spacer"></span>
          <button class="icon-btn" id="studioClose"><svg><use href="#i-close"/></svg></button></header>
        <div id="studioScroll" class="studio-scroll"></div>
        <div class="panel-foot row">
          <button class="btn" id="resetBrush">Reset</button>
          <button class="btn primary" id="saveBrush">Save preset</button>
        </div>
      </div>
    </aside>
  </div>

  <footer class="bottombar">
    <div class="color-wells">
      <button class="well" id="primaryWell" title="Colour" aria-label="Colour"></button>
      <button class="well" id="secondaryWell" title="Secondary colour" aria-label="Secondary colour"></button>
      <button class="icon-btn small" id="swapColor" data-sfx="pick" title="Swap colours" aria-label="Swap colours"><svg><use href="#i-swap"/></svg></button>
    </div>
    <div class="brush-sliders">
      <label class="dock-slider"><span>Size <output id="sizeVal">40</output></span><input id="sizeSlider" type="range" min="1" max="500" value="40"></label>
      <label class="dock-slider"><span>Opacity <output id="opacityVal">100%</output></span><input id="opacitySlider" type="range" min="1" max="100" value="100"></label>
      <label class="dock-slider"><span>Softness <output id="softVal">60%</output></span><input id="softSlider" type="range" min="1" max="100" value="60"></label>
    </div>
    <div class="row">
      <button class="icon-btn" id="quickMenuBtn" title="QuickMenu" aria-label="QuickMenu"><svg><use href="#i-grid4"/></svg></button>
      <button class="btn" id="presetsBtn"><svg><use href="#i-brush"/></svg><span id="brushName">Brushes</span></button>
    </div>
  </footer>
</main>

<div id="sheet" class="sheet hidden"><div class="sheet-body"></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
